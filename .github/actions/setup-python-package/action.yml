name: "Setup Python Environment"
description: "Download and install artifact"

inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.12"
  install-extras:
    description: "Extras to install"
    required: false
    default: ""
  pre-install:
    description: "Shell commands to run before installing the package"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Checkout & Python setup
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # pip < 26.2.2 trusts the compromised eMudhra CA, so it is first upgraded to 26.2.2 by hash.
    # The next command then upgrades to the latest pip as usual.
    # pip 26.2.2 requires Python >= 3.10: older Pythons cannot get the fix.
    # Incident: https://emudhra.we-have-a-problem.com/
    # Recommendations: https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
    # Do not update PINNED_PIP_URL for new pip releases. Remove the bootstrap and
    # PINNED_PIP_URL once setup-python installs pip >= 26.2.2.
    - name: Upgrade pip
      shell: bash
      env:
        PINNED_PIP_URL: "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      run: |
        python -c "import os, subprocess, sys; from pip import __version__; from pip._vendor.packaging.version import Version; sys.version_info >= (3, 10) and Version(__version__) < Version('26.2.2') and subprocess.check_call([sys.executable, '-m', 'pip', 'install', os.environ['PINNED_PIP_URL']])"
        python -c "import sys; sys.version_info < (3, 10) and print('::warning::pip cannot be fixed for the eMudhra CA incident on Python < 3.10, downloads with pip are open to MITM attacks')"
        python -m pip install --upgrade pip

    - name: Run pre-install commands
      if: inputs.pre-install != ''
      shell: bash
      run: ${{ inputs.pre-install }}

    # Download dist artifact
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    # Install the package
    - name: Install package from sdist/wheel
      shell: bash
      run: |
        set -e

        PACKAGE=$(ls dist/*.whl 2>/dev/null | head -n1)
        if [ -z "$PACKAGE" ]; then
          PACKAGE=$(ls dist/*.tar.gz 2>/dev/null | head -n1)
        fi

        if [ -z "$PACKAGE" ]; then
          echo "❌ No dist package found in dist/ folder"
          exit 1
        fi

        echo "Installing package: $PACKAGE"

        if [ -n "${{ inputs.install-extras }}" ]; then
          pip install --pre "$PACKAGE[${{ inputs.install-extras }}]"
        else
          pip install --pre "$PACKAGE"
        fi
